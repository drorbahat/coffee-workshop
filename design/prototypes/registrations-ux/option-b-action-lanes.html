<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>הצעה B — Cockpit תפעולי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--paper:#fffdf9;--surface:#fff;--ink:#211914;--muted:#74675d;--line:#e4d9cc;--accent:#8a5232;--accent-soft:#efe1d4;--need:#a55622;--need-bg:#fff0df;--wait:#647346;--wait-bg:#ecf2e2;--done:#2f6f4f;--done-bg:#e8f2ed;--risk:#8b352a;--risk-bg:#f7e4df;--shadow:0 20px 60px rgba(65,40,23,.1);--radius:22px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Assistant',system-ui,sans-serif;background:radial-gradient(circle at 20% -10%,#fff8ee 0,#f6f1ea 36%,#f4efe7 100%);color:var(--ink);-webkit-font-smoothing:antialiased}body{font-size:16px;line-height:1.45}.app{max-width:1220px;margin:0 auto;padding:20px 18px 44px}.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px) saturate(1.2);border:1px solid var(--line);border-radius:26px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow)}.navline{display:flex;align-items:center;justify-content:space-between;gap:12px}.title h1{margin:0;font-size:clamp(28px,3.8vw,44px);letter-spacing:-.035em;line-height:1}.title small{display:block;color:var(--muted);font-weight:800;margin-top:5px}.picker{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.pick{border:1px solid var(--line);background:var(--paper);border-radius:999px;height:38px;padding:0 13px;font-weight:900;font-family:inherit;white-space:nowrap;cursor:pointer;color:var(--ink)}.pick.active{background:var(--ink);color:#fff;border-color:var(--ink)}.subtools{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}.search{border:1px solid var(--line);border-radius:999px;background:#fff;height:42px;padding:0 15px;font:inherit}.tiny-actions{display:flex;gap:7px}.ghost{border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 13px;font-weight:900;font-family:inherit;cursor:pointer;white-space:nowrap}.pulse{display:grid;grid-template-columns:1.1fr .9fr .9fr;gap:10px;margin-bottom:14px}.pulse-card{background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 0 rgba(65,40,23,.03)}.pulse-card b{display:block;font-size:28px;line-height:1}.pulse-card span{display:block;color:var(--muted);font-weight:800;font-size:13px}.pulse-card.main{background:#211914;color:white;border-color:#211914}.pulse-card.main span{color:#dacfc5}.board{display:grid;grid-template-columns:1.05fr 1fr .9fr;gap:12px;align-items:start}.lane{background:rgba(255,253,249,.72);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;min-height:400px}.lane-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.75)}.lane-title{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px}.num{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;font-size:13px}.lane.need .num{background:var(--need-bg);color:var(--need)}.lane.wait .num{background:var(--wait-bg);color:var(--wait)}.lane.done .num{background:var(--done-bg);color:var(--done)}.count{font-size:13px;font-weight:900;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 9px}.lane-body{padding:9px}.row{background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px 12px;margin:8px 0;cursor:pointer;transition:.15s;position:relative;overflow:hidden}.row:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(65,40,23,.08)}.row:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent);opacity:.7}.row.need:before{background:var(--need)}.row.wait:before{background:var(--wait)}.row.done:before{background:var(--done)}.row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.who{font-weight:950;font-size:16px}.meta{color:var(--muted);font-size:13px;font-weight:700;margin-top:2px}.phone{direction:ltr;unicode-bidi:isolate}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900}.tag.need{background:var(--need-bg);color:var(--need)}.tag.wait{background:var(--wait-bg);color:var(--wait)}.tag.done{background:var(--done-bg);color:var(--done)}.tag.risk{background:var(--risk-bg);color:var(--risk)}.tag.gray{background:#f0ebe4;color:#6f6258}.row-actions{display:flex;gap:7px;margin-top:10px}.action{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:35px;padding:0 10px;font-family:inherit;font-weight:900;cursor:pointer;flex:1;color:var(--ink)}.action.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.action.green{background:var(--done);color:#fff;border-color:var(--done)}.empty{color:var(--muted);text-align:center;padding:35px 12px;font-weight:800}.side{position:sticky;top:122px;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:18px;min-height:520px}.side .eyebrow{font-size:12px;letter-spacing:.15em;color:var(--muted);font-weight:900;text-transform:uppercase}.side h2{font-size:32px;letter-spacing:-.035em;line-height:1;margin:7px 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.detail{background:#fbf8f3;border:1px solid var(--line);border-radius:16px;padding:11px}.detail small{display:block;color:var(--muted);font-weight:900}.detail b{display:block;margin-top:3px}.main-action{display:grid;gap:8px;margin:16px 0}.main-action button{height:45px;border-radius:15px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-family:inherit;font-weight:950;cursor:pointer}.main-action button.secondary{background:#fff;color:var(--ink);border-color:var(--line)}.why{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;color:var(--muted);font-weight:700}.flow{margin-top:16px}.flow h3{margin:0 0 8px;font-size:16px}.flow-step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:8px 0;color:var(--muted)}.dot{width:10px;height:10px;background:var(--accent);border-radius:50%;margin-top:7px}.drawer{display:none;position:fixed;inset:0;z-index:70}.drawer.open{display:block}.scrim{position:absolute;inset:0;background:rgba(33,25,20,.32);backdrop-filter:blur(2px)}.mobile-panel{position:absolute;left:0;right:0;bottom:0;height:78vh;background:#fff;border-radius:28px 28px 0 0;border-top:1px solid var(--line);box-shadow:0 -22px 70px rgba(33,25,20,.22);padding:18px;overflow:auto}.close{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:22px}.toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translateX(50%) translateY(-4px)}
@media (max-width:980px){.board{grid-template-columns:1fr}.side{display:none}.lane{min-height:0}.pulse{grid-template-columns:1fr 1fr 1fr}.row-actions{display:grid;grid-template-columns:1fr 1fr}.topbar{border-radius:20px}.subtools{grid-template-columns:1fr}.tiny-actions{overflow:auto}.navline{display:block}.picker{margin-top:13px}.app{padding:14px 10px 34px}.pulse-card{padding:12px}.pulse-card b{font-size:23px}.lane-head{padding:13px}.lane-body{padding:7px}.row{border-radius:15px}.title h1{font-size:32px}}
@media (min-width:981px){.drawer{display:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="navline">
      <div class="title"><h1>Cockpit הרשמות</h1><small>המסך מתחיל מהפעולה הבאה, לא מהטבלה</small></div>
      <div class="picker" id="workshopPicker">
        <button class="pick active" data-scope="all">כל הסדנאות</button>
        <button class="pick" data-scope="uru">URU תל אביב</button>
        <button class="pick" data-scope="kanopi">קנופי ירושלים</button>
        <button class="pick" data-scope="updates">עדכונים / לידים</button>
      </div>
    </div>
    <div class="subtools">
      <input class="search" id="search" placeholder="חיפוש שם / טלפון / מקור…" />
      <div class="tiny-actions">
        <button class="ghost" data-quick="noWa">לא נשלחה הודעה</button>
        <button class="ghost" data-quick="unpaid">לא שילמו</button>
        <button class="ghost" data-quick="stale">פולואפ</button>
      </div>
    </div>
  </header>

  <section class="pulse">
    <div class="pulse-card main"><b id="pulseNeed">—</b><span>דורשים פעולה עכשיו</span></div>
    <div class="pulse-card"><b id="pulseWait">—</b><span>מחכים לתשלום</span></div>
    <div class="pulse-card"><b id="pulseDone">—</b><span>סגורים / לא פעילים</span></div>
  </section>

  <main class="board">
    <section class="lane need"><div class="lane-head"><div class="lane-title"><span class="num">1</span> טיפול נדרש</div><span class="count" id="cNeed">0</span></div><div class="lane-body" id="needLane"></div></section>
    <section class="lane wait"><div class="lane-head"><div class="lane-title"><span class="num">2</span> מחכה לתשלום</div><span class="count" id="cWait">0</span></div><div class="lane-body" id="waitLane"></div></section>
    <section class="lane done"><div class="lane-head"><div class="lane-title"><span class="num">3</span> שמור / סגור</div><span class="count" id="cDone">0</span></div><div class="lane-body" id="doneLane"></div></section>
    <aside class="side" id="side"></aside>
  </main>
</div>
<div class="drawer" id="drawer"><div class="scrim" data-close></div><div class="mobile-panel"><button class="close" data-close>×</button><div id="mobileDetail"></div></div></div>
<div class="toast" id="toast">עודכן</div>
<script>
const data=[
{id:20,name:'מיכל ברק',phone:'0501111112',edition:'URU · תל אביב',date:'שישי 3.7 11:00–12:30',source:'חבר/ה',seats:1,amount:200,wa:'pending',pay:'pending',reg:'new',age:'חדש',note:'דוגמה — הרשמה חדשה.'},
{id:19,name:'דנה אברהם',phone:'0501111113',edition:'URU · תל אביב',date:'שישי 3.7 11:00',source:'אחר',seats:1,amount:200,wa:'pending',pay:'pending',reg:'new',age:'חדש',note:''},
{id:18,name:'אבי כהן',phone:'0501111114',edition:'URU · תל אביב',date:'שישי 3.7 11:00',source:'אינסטגרם',seats:2,amount:400,wa:'pending',pay:'bit_request_sent',reg:'new',age:'48h',note:'דוגמה — הרשמה קבוצתית.'},
{id:21,name:'יואב שרון',phone:'0501111111',edition:'URU · תל אביב',date:'שישי 3.7 11:00',source:'אינסטגרם',seats:0,amount:0,wa:'pending',pay:'pending',reg:'registered_under_shnir',age:'קבוצה',note:'דוגמה — משתתף בהרשמה קבוצתית.'},
{id:17,name:'טל ישראלי',phone:'0501111115',edition:'קנופי · ירושלים',date:'שני 15.6 16:00–17:30',source:'חבר/ה',seats:1,amount:180,wa:'pending',pay:'pending',reg:'new',age:'ישן',note:''},
{id:15,name:'יוסי לוי',phone:'0501111116',edition:'URU · תל אביב',date:'שישי 3.7 11:00',source:'אינסטגרם',seats:1,amount:200,wa:'outreach_sent',pay:'pending',reg:'new',age:'24h',note:'דוגמה — נרשם מוקדם.'},
{id:13,name:'Noa Amir',phone:'0501111118',edition:'URU · תל אביב',date:'שישי 3.7 11:00',source:'אינסטגרם',seats:1,amount:200,wa:'outreach_sent',pay:'pending',reg:'new',age:'24h',note:''},
{id:12,name:'עומרי דיין',phone:'0501111119',edition:'URU · תל אביב',date:'שישי 3.7 11:00',source:'—',seats:1,amount:200,wa:'pending',pay:'pending',reg:'needs_payment_followup',age:'פולואפ',note:'דוגמה — צריך פולואפ תשלום.'},
{id:11,name:'גל אדרי',phone:'0501111120',edition:'URU · תל אביב',date:'שישי 3.7 11:00',source:'אינסטגרם',seats:1,amount:200,wa:'outreach_sent',pay:'pending',reg:'new',age:'24h',note:''},
{id:9,name:'Shira Melamed',phone:'+972****9999',edition:'עדכונים — סדנת אספרסו',date:'מועד עתידי',source:'אינסטגרם',seats:1,amount:null,wa:'pending',pay:'pending',reg:'not_handled',age:'לא טופל',note:'טלפון לדוגמה מסוך; ליד אספרסו.'},
{id:14,name:'רותם גולן',phone:'0501111117',edition:'עדכונים — סדנת חליטות',date:'מועד עתידי',source:'חבר/ה',seats:1,amount:null,wa:'outreach_sent',pay:'pending',reg:'lead',age:'ליד',note:''},
{id:7,name:'נועם אלון',phone:'0501111121',edition:'קנופי · ירושלים',date:'שני 15.6 16:00–17:30',source:'אינסטגרם',seats:1,amount:180,wa:'pending',pay:'pending',reg:'new',age:'ישן',note:''},
{id:5,name:'תמר רון',phone:'0501111122',edition:'קנופי · ירושלים',date:'שני 15.6 16:00–17:30',source:'חבר/ה',seats:1,amount:180,wa:'pending',pay:'pending',reg:'new',age:'ישן',note:''}
];
let scope='all', query='', quick='', selected=data[0];
function scoped(r){if(scope==='all')return true;if(scope==='uru')return r.edition.includes('URU');if(scope==='kanopi')return r.edition.includes('קנופי');if(scope==='updates')return r.edition.includes('עדכונים');return true}
function laneOf(r){if(r.pay==='paid'||r.reg==='registered_under_shnir'||r.reg==='lead')return 'done'; if(r.pay==='bit_request_sent')return 'wait'; return 'need'}
function matches(r){const hay=(r.name+' '+r.phone+' '+r.edition+' '+r.source+' '+r.note).toLowerCase(); if(query&&!hay.includes(query.toLowerCase()))return false; if(!scoped(r))return false; if(quick==='noWa'&&r.wa!=='pending')return false; if(quick==='unpaid'&&(r.pay==='paid'||!r.amount))return false; if(quick==='stale'&&!(r.reg==='needs_payment_followup'||r.age==='48h'||r.reg==='not_handled'))return false; return true}
function amount(r){return r.amount==null?'—':'₪'+r.amount}
function row(r){const lane=laneOf(r); const action=lane==='need'?(r.wa==='pending'?'פתח WhatsApp':'שלח/בדוק Bit'):lane==='wait'?'סמן שולם':'פרטים';return `<article class="row ${lane}" data-id="${r.id}"><div class="row-top"><div><div class="who">${r.name}</div><div class="meta"><span class="phone">${r.phone}</span> · ${r.edition}</div></div><span class="tag ${r.reg==='needs_payment_followup'||r.reg==='not_handled'?'risk':lane}">${r.age}</span></div><div class="tags"><span class="tag gray">${r.seats} מקומות</span><span class="tag gray">${amount(r)}</span><span class="tag ${r.wa==='pending'?'need':'done'}">${r.wa==='pending'?'לא נשלחה הודעה':'נשלחה הודעה'}</span></div><div class="row-actions"><button class="action primary" data-action="main">${action}</button><button class="action" data-action="open">פתח</button></div></article>`}
function render(){const rows=data.filter(matches);const need=rows.filter(r=>laneOf(r)==='need'),wait=rows.filter(r=>laneOf(r)==='wait'),done=rows.filter(r=>laneOf(r)==='done'); document.getElementById('pulseNeed').textContent=need.length;document.getElementById('pulseWait').textContent=wait.length;document.getElementById('pulseDone').textContent=done.length;document.getElementById('cNeed').textContent=need.length;document.getElementById('cWait').textContent=wait.length;document.getElementById('cDone').textContent=done.length; fill('needLane',need);fill('waitLane',wait);fill('doneLane',done); document.querySelectorAll('.row').forEach(el=>{el.addEventListener('click',e=>{selected=data.find(x=>x.id==el.dataset.id); if(e.target.dataset.action==='main'){mainAction(selected); e.stopPropagation(); return} show(selected)})}); if(!rows.includes(selected)) selected=rows[0]||data[0]; show(selected,false)}
function fill(id,arr){document.getElementById(id).innerHTML=arr.length?arr.map(row).join(''):'<div class="empty">אין כרגע</div>'}
function detailHtml(r){const lane=laneOf(r);const next=lane==='need'?(r.wa==='pending'?'הפעולה הבאה: לשלוח הודעת WhatsApp':'הפעולה הבאה: לשלוח/לוודא בקשת Bit'):lane==='wait'?'הפעולה הבאה: לסמן כשולם אחרי תשלום':'אין פעולה דחופה';return `<div class="eyebrow">פרטי נרשם</div><h2>${r.name}</h2><div class="phone" style="font-weight:900;color:var(--muted)">${r.phone}</div><div class="tags" style="margin-top:12px"><span class="tag ${lane}">${lane==='need'?'טיפול נדרש':lane==='wait'?'מחכה לתשלום':'סגור'}</span><span class="tag gray">${r.source}</span></div><div class="details"><div class="detail"><small>סדנה</small><b>${r.edition}</b></div><div class="detail"><small>מועד</small><b>${r.date}</b></div><div class="detail"><small>מקומות</small><b>${r.seats}</b></div><div class="detail"><small>סכום</small><b>${amount(r)}</b></div></div><div class="main-action"><button onclick="mainActionById(${r.id})">${lane==='need'?(r.wa==='pending'?'פתח WhatsApp':'שלח/בדוק Bit'):lane==='wait'?'סמן כשולם':'פתח פרטים'}</button><button class="secondary" onclick="toast('הערה נשמרת בפרודקשן')">הוסף הערה / תיעוד</button></div><p class="why">${next}. ${r.note||''}</p><div class="flow"><h3>מה קרה עד עכשיו</h3><div class="flow-step"><span class="dot"></span><span>נקלט מטופס הרשמה</span></div><div class="flow-step"><span class="dot"></span><span>WhatsApp: ${r.wa==='pending'?'טרם נשלח':'נשלח'}</span></div><div class="flow-step"><span class="dot"></span><span>תשלום: ${r.pay==='pending'?'טרם שולם':r.pay==='bit_request_sent'?'בקשת Bit נשלחה':'שולם'}</span></div></div>`}
function show(r,openMobile=true){document.getElementById('side').innerHTML=detailHtml(r);document.getElementById('mobileDetail').innerHTML=detailHtml(r);if(openMobile&&innerWidth<981)document.getElementById('drawer').classList.add('open')}
function mainAction(r){if(laneOf(r)==='need'&&r.wa==='pending')toast('פותח WhatsApp עם הודעה מוכנה');else if(laneOf(r)==='need')toast('סומן: בקשת Bit נשלחה');else if(laneOf(r)==='wait')toast('סומן כשולם — בפרוטוטייפ בלבד');else toast('אין פעולה דחופה')}
function mainActionById(id){mainAction(data.find(r=>r.id===id))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
document.getElementById('workshopPicker').addEventListener('click',e=>{const b=e.target.closest('[data-scope]');if(!b)return;scope=b.dataset.scope;document.querySelectorAll('.pick').forEach(x=>x.classList.toggle('active',x===b));render()});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});
document.querySelectorAll('[data-quick]').forEach(b=>b.addEventListener('click',()=>{quick=quick===b.dataset.quick?'':b.dataset.quick;document.querySelectorAll('[data-quick]').forEach(x=>{x.style.background=x.dataset.quick===quick?'#211914':'#fff';x.style.color=x.dataset.quick===quick?'#fff':'var(--ink)'});render()}));
document.querySelectorAll('[data-close]').forEach(el=>el.addEventListener('click',()=>document.getElementById('drawer').classList.remove('open')));
render();
</script>
</body>
</html>
